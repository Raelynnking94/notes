openapi: 3.0.0
info:
  title: Apex Ledger API
  version: 1.0.0
  description: Professional bookkeeping and expense tracking API
  contact:
    name: Apex Ledger Support
    url: https://apexledger.com

servers:
  - url: http://localhost:5000/api
    description: Development
  - url: https://api.apexledger.com
    description: Production

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    User:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        email:
          type: string
        businessName:
          type: string
        subscription:
          type: object
          properties:
            tier:
              enum: [free, pro, enterprise]
            status:
              enum: [active, inactive, canceled]
            renewalDate:
              type: string
              format: date-time

    Transaction:
      type: object
      properties:
        id:
          type: string
        userId:
          type: string
        type:
          enum: [income, expense]
        amount:
          type: number
        category:
          type: string
        description:
          type: string
        date:
          type: string
          format: date-time
        vendor:
          type: string
        taxable:
          type: boolean
        w2vs1099:
          enum: [W2, 1099, personal, business]
        auditVerified:
          type: boolean
        bankSynced:
          type: boolean

    DashboardMetrics:
      type: object
      properties:
        totalIncome:
          type: number
        totalExpenses:
          type: number
        netCashFlow:
          type: number
        totalTaxes:
          type: number
        expensesByCategory:
          type: object

paths:
  /auth/register:
    post:
      summary: Register new user
      tags: [Authentication]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                email:
                  type: string
                password:
                  type: string
                businessName:
                  type: string
      responses:
        201:
          description: User created successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  token:
                    type: string
                  user:
                    $ref: '#/components/schemas/User'

  /auth/login:
    post:
      summary: Login user
      tags: [Authentication]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                password:
                  type: string
      responses:
        200:
          description: Login successful
          content:
            application/json:
              schema:
                type: object
                properties:
                  token:
                    type: string
                  user:
                    $ref: '#/components/schemas/User'

  /transactions:
    post:
      summary: Record new transaction
      tags: [Transactions]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Transaction'
      responses:
        201:
          description: Transaction created
    get:
      summary: Get transactions
      tags: [Transactions]
      security:
        - bearerAuth: []
      parameters:
        - name: startDate
          in: query
          schema:
            type: string
            format: date
        - name: endDate
          in: query
          schema:
            type: string
            format: date
        - name: category
          in: query
          schema:
            type: string
        - name: type
          in: query
          schema:
            enum: [income, expense]
      responses:
        200:
          description: List of transactions
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Transaction'

  /transactions/{id}:
    put:
      summary: Update transaction
      tags: [Transactions]
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        200:
          description: Transaction updated
    delete:
      summary: Delete transaction
      tags: [Transactions]
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        200:
          description: Transaction deleted

  /dashboard/metrics:
    get:
      summary: Get dashboard metrics
      tags: [Dashboard]
      security:
        - bearerAuth: []
      parameters:
        - name: period
          in: query
          schema:
            type: string
            default: '30'
            description: Number of days (30, 90, 365)
      responses:
        200:
          description: Dashboard metrics
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DashboardMetrics'

  /dashboard/audit-report:
    get:
      summary: Get audit-ready compliance report
      tags: [Dashboard]
      security:
        - bearerAuth: []
      responses:
        200:
          description: Audit report
          content:
            application/json:
              schema:
                type: object
                properties:
                  complianceScore:
                    type: number
                  auditVerifiedCount:
                    type: integer
                  readyForTaxPrep:
                    type: boolean

  /subscriptions:
    get:
      summary: Get subscription info and available tiers
      tags: [Subscriptions]
      security:
        - bearerAuth: []
      responses:
        200:
          description: Subscription info

  /subscriptions/upgrade:
    post:
      summary: Upgrade subscription tier
      tags: [Subscriptions]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                tier:
                  enum: [free, pro, enterprise]
      responses:
        200:
          description: Subscription upgraded
