version: '3.8'

services:
  mongodb:
    image: mongo:6.0
    container_name: apex-ledger-db
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: password123
    volumes:
      - mongo-data:/data/db
    networks:
      - apex-network

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: apex-ledger-api
    ports:
      - "5000:5000"
    environment:
      MONGODB_URI: mongodb://admin:password123@mongodb:27017/apex-ledger?authSource=admin
      JWT_SECRET: apex-ledger-secret-key-change-in-production
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET}
      NODE_ENV: production
    depends_on:
      - mongodb
    networks:
      - apex-network
    volumes:
      - ./uploads:/app/uploads

  frontend:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: apex-ledger-web
    ports:
      - "3000:3000"
    environment:
      VITE_API_URL: http://localhost:5000
    depends_on:
      - backend
    networks:
      - apex-network

volumes:
  mongo-data:

networks:
  apex-network:
    driver: bridge
